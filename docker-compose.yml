# bysyc — one self-hosted Instance.
# Copy .env.example to .env and set the passwords before `docker compose up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bysyc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: bysyc
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host port is 15432, not 5432, to stay out of the way of any local
    # postgres install. Loopback-only: never exposed on a public interface.
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bysyc -d bysyc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    # Single-process mode: master + volume + filer + S3 gateway in one container.
    # Clients never talk to it directly — only bysyc-server does, via the S3 API.
    # s3.json (generated from .env — see deploy/seaweedfs/) enforces SigV4
    # auth on the gateway; regenerate it whenever S3_* keys change.
    command: >
      server -dir=/data -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -ip=seaweedfs
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # TODO: add healthcheck once we settle the image's shell tooling for probes.

  coturn:
    image: coturn/coturn:alpine
    # Relay for peers behind hard NATs. Forwarded packets stay E2EE —
    # TURN never holds keys. --external-ip defaults to loopback for dev;
    # set COTURN_EXTERNAL_IP to the VPS public IP in .env for production.
    command: >
      -n --realm=bysyc --fingerprint --lt-cred-mech
      --user=bysyc:${TURN_PASSWORD:?set in .env}
      --min-port=49160 --max-port=49200
      --external-ip=${COTURN_EXTERNAL_IP:-127.0.0.1}
      --listening-ip=0.0.0.0
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://bysyc:${POSTGRES_PASSWORD}@postgres/bysyc
      REDIS_URL: redis://redis/1
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      TURN_ADDR: ${TURN_ADDR:-localhost:3478}
      TURN_PASSWORD: ${TURN_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started

volumes:
  pgdata:
  seaweed:
