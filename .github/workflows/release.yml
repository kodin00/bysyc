name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Never cancel an in-flight release; a re-pushed tag just queues behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: build macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --package bysyc-client

      - name: Package
        run: |
          tar -czf "bysyc-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" \
            -C target/aarch64-apple-darwin/release bysyc-client

      - uses: actions/upload-artifact@v4
        with:
          name: bysyc-macos-aarch64
          path: bysyc-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  build-windows:
    name: build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --package bysyc-client

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/x86_64-pc-windows-msvc/release/bysyc-client.exe `
            -DestinationPath "bysyc-${{ github.ref_name }}-x86_64-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: bysyc-windows-x86_64
          path: bysyc-${{ github.ref_name }}-x86_64-windows.zip
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
