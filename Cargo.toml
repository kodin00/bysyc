[workspace]
resolver = "3"
members = ["common", "client", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bysyc-common = { path = "common" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
strip = true
