[package]
name = "bysyc-client"
version.workspace = true
edition.workspace = true

[dependencies]
bysyc-common = { workspace = true }
eframe = "0.37"
egui_extras = { version = "0.36", features = ["image", "svg"] }
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp"] }
webp = { version = "0.3", default-features = false }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
vodozemac = "0.11"
aes-gcm = "0.10"
str0m = "0.24"
cpal = "0.18"
opus = "0.4"
arc-swap = "1"
base64 = "0.23"
thiserror = "2"
anyhow = "1"
rand = "0.10"
directories = "6"
rfd = "0.15"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# In-process server for the hermetic integration test (client/tests/hermetic.rs).
# reqwest and tokio-tungstenite are already normal dependencies, so the live
# REST + WS client paths exercise the real transport.
bysyc-server = { path = "../server" }
# Containerized postgres + redis for the hermetic test. The image definitions
# live in testcontainers-modules (community split of the testcontainers core);
# testcontainers is the runner/runtime, re-exported through the modules crate.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
# Direct registration-invite inserts against state.pg (the hermetic test mints
# its own codes instead of shelling out to the server binary).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
# axum::serve hosts the in-process router on an ephemeral port.
axum = "0.8"
